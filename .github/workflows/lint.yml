name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

# Least-privilege: this workflow only needs to read the checkout
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x]

        steps:
            - uses: actions/checkout@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test
            - run: npm run lint
            # Drift gate: dev vault == shipped artifacts, index == fresh build, no banned text.
            - run: npm run schema:check
            - run: npm run typecheck:test
            # Guards the hand-written Obsidian mock against the real obsidian API:
            # a fictional method on the mock (e.g. metadataCache.iterateAllFiles)
            # becomes a compile error here instead of a runtime crash in Obsidian.
            - run: npm run typecheck:mock
