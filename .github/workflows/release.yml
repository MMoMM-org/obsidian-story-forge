name: Release

# Every push to main runs semantic-release: feat → minor, fix/perf → patch,
# anything else → no release. The version follows the tags (baseline tag 0.1.0),
# so the first automatic release is 0.2.0. The release commit carries [skip ci].
# workflow_dispatch stays for a manual re-run.
on:
    push:
        branches: [main]
    workflow_dispatch:

# One release at a time; a second push waits instead of racing the first.
concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write
    issues: write
    pull-requests: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - run: npm test

            # The main-branch ruleset requires CodeQL results for every commit,
            # which semantic-release's own release commit can never have. The
            # GitHub Actions app cannot be a ruleset bypass actor, so the push
            # runs as our own release GitHub App, which is a bypass actor
            # (#64). Merges via PR stay CodeQL-gated. The `[skip ci]` in the
            # release commit message keeps the app's push from retriggering
            # workflows (unlike GITHUB_TOKEN, an app token would).
            - name: Mint release app token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - name: Release
              id: release
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
              run: npx semantic-release

            # Attest the bytes that semantic-release actually uploaded.
            # semantic-release's exec/prepareCmd reruns `node version-bump.mjs
            # && npm run build`, which rewrites build/main.js, build/styles.css
            # and build/manifest.json with the bumped version BEFORE the github
            # plugin uploads them. Attesting after the Release step signs those
            # exact bytes; users can verify via `gh attestation verify <file>
            # --owner MMoMM-org`. If no release is cut (chore/ci commits),
            # this still runs and attests the pre-release build artifacts —
            # harmless, since nothing is published.
            - name: Attest build provenance
              uses: actions/attest-build-provenance@v4
              with:
                  subject-path: |
                      build/main.js
                      build/styles.css
                      build/manifest.json
